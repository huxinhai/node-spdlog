name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  id-token: write

jobs:
  package:
    name: Release Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macos-x64
          - os: macos-14
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: windows-latest
            label: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify runtime
        run: pnpm run verify:runtime

      - name: Install UPX on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y upx-ucl || sudo apt-get install -y upx)

      - name: Install UPX on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install upx -y

      - name: Package runner artifact
        run: pnpm run package:runner
        env:
          ARTIFACT_LABEL: ${{ matrix.label }}

      - name: Verify packaged artifact
        run: pnpm run verify:packaged
        env:
          ARTIFACT_LABEL: ${{ matrix.label }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.label }}
          path: artifacts/**

  publish:
    name: Publish Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          pattern: release-*

      - name: Assemble npm package artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts dist
          mkdir -p artifacts
          for dir in release-artifacts/release-*; do
            label="${dir#release-artifacts/release-}"
            cp -R "$dir/$label" "artifacts/$label"
          done
          cp -R artifacts/linux-x64/dist ./dist
          node -e "const pkg=require('./package.json'); if (!process.env.GITHUB_REF_NAME.endsWith(pkg.version)) { throw new Error(\`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${pkg.version}\`); }"

      - name: Verify npm package contents
        run: npm publish --dry-run --provenance

      - name: Bundle release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles
          VERSION="${GITHUB_REF_NAME}"
          for dir in release-artifacts/release-*; do
            label="${dir#release-artifacts/release-}"
            archive="bundles/spdog-${VERSION}-${label}.zip"
            (
              cd "$dir"
              zip -r "../../${archive}" .
            )
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: bundles/*.zip
          generate_release_notes: true

      - name: Publish npm package
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
