name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  package:
    name: Release Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macos-x64
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify runtime
        run: pnpm run verify:runtime

      - name: Install UPX
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install upx -y

      - name: Package runner artifact
        run: pnpm run package:runner
        env:
          ARTIFACT_LABEL: ${{ matrix.label }}

      - name: Verify packaged artifact
        run: node -e "const spdog=require('./artifacts/${{ matrix.label }}/dist'); spdog.info('packaged artifact verification ok'); console.log(JSON.stringify(spdog.version));"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.label }}
          path: artifacts/**

  publish:
    name: Publish Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          pattern: release-*

      - name: Bundle release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles
          VERSION="${GITHUB_REF_NAME}"
          for dir in release-artifacts/release-*; do
            label="${dir#release-artifacts/release-}"
            archive="bundles/spdog-${VERSION}-${label}.zip"
            (
              cd "$dir"
              zip -r "../../${archive}" .
            )
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: bundles/*.zip
          generate_release_notes: true
