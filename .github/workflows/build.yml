name: Build And Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macos-x64
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify runtime
        run: pnpm run verify:runtime

  package:
    name: Package (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macos-x64
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Install UPX
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install upx -y

      - name: Package runner artifact
        run: pnpm run package:runner
        env:
          ARTIFACT_LABEL: ${{ matrix.label }}

      - name: Verify packaged artifact
        run: node -e "const spdog=require('./artifacts/${{ matrix.label }}/dist'); spdog.info('packaged artifact verification ok'); console.log(JSON.stringify(spdog.version));"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.label }}
          path: artifacts/**
